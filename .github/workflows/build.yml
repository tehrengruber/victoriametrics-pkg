name: Build

# Builds the package for real, in an Arch container, on x86_64 and aarch64.
# This is what catches an upstream that renames or restructures its release
# tarball — the failure a checksum bump alone sails straight past, and which
# would otherwise surface on the host at deploy time.
#
# Runs on pull requests so the result is a check on the change itself, which is
# what the update workflow's auto-merge waits for.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep the job id "build": branch protection requires the "build / build" check.
  build:
    uses: tehrengruber/arch-pre-built-packages/.github/workflows/pkg-repo-build.yml@v0.6
    # Builds every architecture in the PKGBUILD's arch=() natively, i.e.
    # x86_64 and aarch64.
    with:
      check_package: victoriametrics
      expected_files: >-
        usr/bin/victoria-metrics
        usr/lib/systemd/system/victoriametrics.service
        etc/default/victoriametrics
